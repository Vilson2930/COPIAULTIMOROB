name: Nemotron - Auditoria Completa do Robo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check NVIDIA secret
        shell: bash
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY nao configurada."
            exit 1
          fi
          echo "NVIDIA_API_KEY encontrada."

      - name: 1 - Auditoria estrutural completa
        run: python -u studies/nemotron_robot_auditor.py

      - name: 2 - Filtro factual robusto em blocos
        run: python -u studies/nemotron_fact_filter_resume.py

      - name: 3 - Julgamento tecnico final
        run: python -u studies/nemotron_decision_filter.py

      - name: Upload complete audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-complete-robot-audit
          path: outputs/nemotron_robot_audit/
          if-no-files-found: warn
